<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulțumim — Global Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{
    --paper:#FAF9F5;
    --ink:#1B1A17;
    --ink-soft:#55524A;
    --line:#DEDACF;
    --blue:#2C4A8C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px;
  }
  .card{
    max-width:480px;text-align:center;
  }
  .cat{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase;
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:500;
    font-size:clamp(30px,5vw,44px);line-height:1.1;margin:0 0 18px;
  }
  h1 em{font-style:italic;color:var(--blue);}
  p{color:var(--ink-soft);font-size:16px;line-height:1.6;margin:0 0 32px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 26px;border-radius:2px;
    font-size:14px;font-weight:600;text-decoration:none;
    border:1px solid var(--ink);color:var(--ink);
  }
  .btn:hover{background:var(--ink);color:var(--paper);}
  .icon{font-size:36px;color:var(--blue);margin-bottom:20px;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="ti ti-check" aria-hidden="true"></i></div>
    <div class="cat">Mesaj trimis</div>
    <h1>Mulțumim <em>frumos!</em></h1>
    <p>Am primit mesajul tău și îți vom răspunde cât mai curând posibil, de obicei în câteva zile lucrătoare.</p>
    <a href="/" class="btn">← Înapoi la site</a>
  </div>
</body>
</html>
